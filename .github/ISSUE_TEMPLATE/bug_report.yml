name: Bug report
description: Something doesn't work, or Headroom deleted something it shouldn't have.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. If it's a security problem, please report it privately instead (see [SECURITY.md](https://github.com/marvin-splitt/headroom/blob/main/SECURITY.md)).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: dropdown
    id: deleted
    attributes:
      label: Did Headroom delete something it shouldn't have?
      options:
        - 'No'
        - 'Yes'
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Headroom version
      description: Headroom → About Headroom
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: macOS 15.4
    validations:
      required: true
  - type: dropdown
    id: mac
    attributes:
      label: Mac
      options:
        - Apple silicon
        - Intel
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Screenshots or error messages
