name: Release

# Pushing a version tag (npm version …, then git push --follow-tags) builds Headroom for Apple silicon and
# Intel and publishes a GitHub release. Running it by hand from the Actions tab builds without publishing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # Optional: with a Developer ID certificate and an App Store Connect API key in the repository secrets,
      # the app is signed and notarized. Without them it is signed ad hoc, like a local build.
      - name: Check for a signing certificate
        id: signing
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
        run: echo "enabled=${CSC_LINK:+true}" >> "$GITHUB_OUTPUT"

      - name: Check the tag and the changelog
        if: github.event_name == 'push'
        env:
          HEADROOM_SIGNED: ${{ steps.signing.outputs.enabled }}
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in package.json."
            exit 1
          fi
          node scripts/changelog.mjs notes "$version" > "$RUNNER_TEMP/notes.md"

      # electron-builder downloads Electron for each architecture itself.
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm test

      - name: Sign with the Developer ID certificate
        if: steps.signing.outputs.enabled == 'true'
        run: |
          npm pkg delete build.mac.identity
          npm pkg set build.mac.hardenedRuntime=true --json
          npm pkg set build.mac.entitlements=build/entitlements.signed.plist build.mac.entitlementsInherit=build/entitlements.signed.plist

      - name: Build
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          NOTARY_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        # Missing secrets arrive as empty strings, and electron-builder reads an empty CSC_LINK as a path.
        run: |
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_ID APPLE_API_ISSUER; do
            [ -n "${!v}" ] || unset "$v"
          done
          if [ -n "$CSC_LINK" ]; then
            # A signed app that isn't notarized still gets blocked by macOS, so don't build one.
            if [ -z "$NOTARY_KEY" ] || [ -z "$APPLE_API_KEY_ID" ] || [ -z "$APPLE_API_ISSUER" ]; then
              echo "::error::Notarizing needs the APPLE_API_KEY, APPLE_API_KEY_ID and APPLE_API_ISSUER secrets."
              exit 1
            fi
            # notarytool reads the key from a file.
            export APPLE_API_KEY="$RUNNER_TEMP/notary-key.p8"
            printf '%s\n' "$NOTARY_KEY" > "$APPLE_API_KEY"
          fi
          unset NOTARY_KEY
          npm run dist
      - name: Check the signature and notarization
        if: steps.signing.outputs.enabled == 'true'
        run: |
          for app in dist/mac/Headroom.app dist/mac-arm64/Headroom.app; do
            codesign --verify --deep --strict "$app"
            spctl --assess --type execute -vv "$app"
            xcrun stapler validate "$app"
          done
      - name: Write checksums
        working-directory: dist
        run: shasum -a 256 *.dmg *.zip | tee SHA256SUMS.txt

      - name: Keep the build
        if: github.event_name != 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Headroom
          path: |
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS.txt
          retention-days: 14
      - name: Publish the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" dist/*.dmg dist/*.zip dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "Headroom ${GITHUB_REF_NAME#v}" \
            --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"
